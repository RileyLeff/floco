[package]
name = "floco"
version = "0.2.0"
edition = "2021"
description = "A wrapper for floats with user-defined constraints."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "2.0.12"
paste = "1.0"

[features]
default = []
# This feature enables runtime-checked defaults for compatibility with
# complex types like `uom::Quantity` whose operations are not `const`.
runtime-defaults = []

[dev-dependencies]
uom = { version = "0.37.0", default-features = false, features = ["f64", "std", "si", "serde"] }
serde_json = "1.0"
